<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cooper Walk Tracer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:#f4f6f8;color:#1d2733}
#app{display:flex;flex-direction:column;height:100%}
header{padding:10px 14px;background:#1f6f5c;color:#fff;font-weight:600;font-size:17px;display:flex;justify-content:space-between;align-items:center}
header small{font-weight:400;opacity:.85;font-size:12px}
#map{flex:1;min-height:45vh}
#panel{background:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.08);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
button{font-size:15px;font-weight:600;padding:13px 4px;border:0;border-radius:12px;background:#e7eef0;color:#1d2733;touch-action:manipulation}
button:active{transform:scale(.97)}button.p{background:#1f6f5c;color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.s{background:#f4f6f8;border-radius:10px;padding:6px 4px;text-align:center}
.s b{display:block;font-size:16px}.s span{font-size:11px;color:#5b6773}
#prof{width:100%;height:110px;display:block;margin-top:8px;background:#f9fbfb;border-radius:10px}
#status{font-size:12px;color:#5b6773;margin-top:4px;min-height:15px}
@media(min-width:900px){#app{flex-direction:row;flex-wrap:wrap}header{width:100%}#map{height:calc(100% - 44px)}#panel{width:420px;overflow:auto}}
</style></head><body><div id="app">
<header>🐕 Cooper Walk Tracer <small>tap the map to add points</small></header>
<div id="map"></div>
<div id="panel">
<div class="btns"><button id="undo">↶ Undo</button><button id="clear">Clear</button><button id="loop" class="p">⌂ Close loop</button><button id="copy">Copy route</button></div>
<div class="stats">
<div class="s"><b id="mi">0.00</b><span>miles</span></div><div class="s"><b id="ft">0</b><span>feet</span></div>
<div class="s"><b id="time">0 min</b><span>@ 3 mph</span></div><div class="s"><b id="avg">–</b><span>avg grade</span></div>
<div class="s"><b id="up">–</b><span>climb ft</span></div><div class="s"><b id="down">–</b><span>descent ft</span></div>
<div class="s"><b id="mm">–</b><span>min/max ft</span></div><div class="s"><b id="steep">–</b><span>steepest</span></div>
</div>
<canvas id="prof"></canvas><div id="status">Home is marked. Tap along your route.</div>
</div></div>
<script>
const HOME=[47.6072589,-117.4190522];
const map=L.map('map',{tap:true}).setView(HOME,16);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
L.marker(HOME,{title:'Home'}).addTo(map).bindPopup('🏠 Home');
let pts=[HOME.slice()];const line=L.polyline(pts,{color:'#1f6f5c',weight:5}).addTo(map);const dots=L.layerGroup().addTo(map);
const $=id=>document.getElementById(id);const R=6371000;
function hav(a,b){const r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r,x=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function sample(){const out=[{p:pts[0],d:0}];let tot=0;for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],L_=hav(a,b),n=Math.max(1,Math.ceil(L_/25));for(let k=1;k<=n;k++){const t=k/n;out.push({p:[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t],d:tot+L_*t})}tot+=L_}return out}
const cache=new Map();const key=p=>p[0].toFixed(5)+','+p[1].toFixed(5);let api='USGS EPQS',epqsFail=0;
async function epqs(p){const r=await fetch(`https://epqs.nationalmap.gov/v1/json?x=${p[1]}&y=${p[0]}&units=Feet&wkid=4326`);const j=await r.json();const v=parseFloat(j.value);if(!isFinite(v)||v<-1000)throw 0;return v}
async function meteo(list){for(let i=0;i<list.length;i+=100){const c=list.slice(i,i+100);const r=await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${c.map(p=>p[0].toFixed(5))}&longitude=${c.map(p=>p[1].toFixed(5))}`);const j=await r.json();j.elevation.forEach((m,k)=>cache.set(key(c[k]),m*3.28084))}}
async function getElev(list){const need=[...new Map(list.filter(p=>!cache.has(key(p))).map(p=>[key(p),p])).values()];if(!need.length)return;
 if(epqsFail<3){let q=need.slice(),bad=[];await Promise.all(Array.from({length:6},async()=>{while(q.length){const p=q.shift();try{cache.set(key(p),await epqs(p))}catch(e){bad.push(p);epqsFail++}}}));if(!bad.length){api='USGS EPQS';return}need.length=0;need.push(...bad)}
 api='Open-Meteo';await meteo(need)}
let gen=0;
async function update(){line.setLatLngs(pts);dots.clearLayers();pts.slice(1).forEach(p=>L.circleMarker(p,{radius:6,color:'#fff',weight:2,fillColor:'#1f6f5c',fillOpacity:1}).addTo(dots));
 const s=sample(),D=s[s.length-1].d,mi=D/1609.344;$('mi').textContent=mi.toFixed(2);$('ft').textContent=Math.round(D*3.28084).toLocaleString();$('time').textContent=Math.round(mi/3*60)+' min';
 if(pts.length<2){['avg','up','down','mm','steep'].forEach(i=>$(i).textContent='–');draw([]);$('status').textContent='Tap along your route.';return}
 const my=++gen;$('status').textContent='Fetching elevation for '+s.length+' points…';
 try{await getElev(s.map(x=>x.p))}catch(e){if(my===gen)$('status').textContent='Elevation unavailable (offline?)';return}
 if(my!==gen)return;const prof=s.map(x=>({d:x.d*3.28084,e:cache.get(key(x.p))})).filter(x=>x.e!=null);
 let up=0,dn=0,steep=0;for(let i=1;i<prof.length;i++){const de=prof[i].e-prof[i-1].e;de>0?up+=de:dn-=de}
 // steepest over ~160 ft (~50 m) windows to smooth noise
 for(let i=0;i<prof.length;i++){for(let j=i+1;j<prof.length;j++){const dd=prof[j].d-prof[i].d;if(dd>=160){const g=(prof[j].e-prof[i].e)/dd*100;if(Math.abs(g)>Math.abs(steep))steep=g;break}}}
 const es=prof.map(x=>x.e),mn=Math.min(...es),mx=Math.max(...es),Dft=D*3.28084;
 $('up').textContent=Math.round(up);$('down').textContent=Math.round(dn);$('mm').textContent=Math.round(mn)+'/'+Math.round(mx);
 $('avg').textContent=Dft?(up/Dft*100).toFixed(1)+'%':'–';$('steep').textContent=(steep>0?'+':'')+steep.toFixed(1)+'%';
 $('status').textContent=`Elevation: ${api} · ${prof.length} samples (~25 m apart) · avg grade = climb ÷ distance`;draw(prof)}
function draw(prof){const c=$('prof'),dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,w,h);
 if(prof.length<2){x.fillStyle='#9aa5ae';x.font='12px sans-serif';x.fillText('Elevation profile appears here',10,h/2);return}
 const es=prof.map(p=>p.e),mn=Math.min(...es),mx=Math.max(...es),rg=Math.max(mx-mn,20),D=prof[prof.length-1].d,pl=34,pb=14;
 const X=d=>pl+(w-pl-6)*d/D,Y=e=>6+(h-pb-6)*(1-(e-mn)/rg);
 x.beginPath();x.moveTo(X(0),h-pb);prof.forEach(p=>x.lineTo(X(p.d),Y(p.e)));x.lineTo(X(D),h-pb);x.closePath();
 const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(31,111,92,.45)');g.addColorStop(1,'rgba(31,111,92,.05)');x.fillStyle=g;x.fill();
 x.beginPath();prof.forEach((p,i)=>i?x.lineTo(X(p.d),Y(p.e)):x.moveTo(X(p.d),Y(p.e)));x.strokeStyle='#1f6f5c';x.lineWidth=2;x.stroke();
 x.fillStyle='#5b6773';x.font='10px sans-serif';x.fillText(Math.round(mn+rg)+'′',2,12);x.fillText(Math.round(mn)+'′',2,h-pb);x.fillText((D/5280).toFixed(2)+' mi',w-44,h-2);x.fillText('0',pl,h-2)}
map.on('click',e=>{pts.push([e.latlng.lat,e.latlng.lng]);update()});
$('undo').onclick=()=>{if(pts.length>1){pts.pop();update()}};
$('clear').onclick=()=>{pts=[HOME.slice()];update()};
$('loop').onclick=()=>{const l=pts[pts.length-1];if(pts.length>1&&(l[0]!==HOME[0]||l[1]!==HOME[1])){pts.push(HOME.slice());update()}};
$('copy').onclick=async()=>{const t='route:'+pts.map(p=>p[0].toFixed(5)+','+p[1].toFixed(5)).join(';');try{await navigator.clipboard.writeText(t);$('status').textContent='Copied! Paste it in chat.'}catch(e){prompt('Copy this route:',t)}};
addEventListener('resize',()=>update());update();
</script></body></html>
